<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Ranchers&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Português com Pedro! 🐧📚</title>
    <style>
        .cubotxt-port {
            margin: auto;
            margin-top: 100px;
            margin-bottom: 30px;
            width: 330px;
            min-height: 420px;
            height: auto;
            padding-bottom: 20px;
            background-color: #4e72de96;
            border-radius: 20px 20px 0px 0px;
            border: 2px solid #1d4bd4;
            text-shadow: 2px 2px 2px #07072b7a;
        }
        .placar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 5px 0;
        }
        .placar span {
            font-family: "Ranchers", cursive;
            font-size: 20px;
            background-color: rgb(54, 69, 228, 0.5);
            border-radius: 12px;
            padding: 4px 12px;
            color: #f8f5ffde;
        }
        .tipos {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 10px;
        }
        .tipos button {
            width: 100px;
            height: 50px;
            font-size: 18px;
        }
        .tipos button.ativo {
            background-color: rgb(50, 125, 255);
            border: 2px solid #fff;
        }
        .continha {
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 15px;
            margin: 12px;
            padding: 10px 5px;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .emoji-linha {
            font-size: 60px;
            line-height: 1.2;
        }
        .palavra-linha {
            font-family: "Ranchers", cursive;
            font-size: 34px;
            color: #ffe45e;
            text-shadow: 2px 2px 2px #1c1c1ce4;
            letter-spacing: 4px;
            margin-top: 5px;
        }
        .letra-destaque {
            background-color: #ff5e5e;
            color: #fff;
            padding: 0 6px;
            border-radius: 6px;
        }
        .letra-grande {
            font-family: "Ranchers", cursive;
            font-size: 110px;
            color: #ffe45e;
            text-shadow: 3px 3px 3px #1c1c1ce4;
            line-height: 1;
        }
        .pergunta {
            font-size: 26px !important;
            background-color: rgb(54, 69, 228, 0.5);
            margin: 10px 12px !important;
            border-radius: 12px;
            padding: 6px;
        }
        .pergunta:focus,
        .continha:focus {
            outline: none;
        }
        .opcoes {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 10px;
            min-height: 60px;
        }
        .opcoes button {
            width: 90px;
            height: 60px;
            font-size: 32px;
        }
        .opcoes button.largo {
            width: 130px;
            font-size: 20px;
        }
        .opcoes button.certo {
            background-color: #37c837;
        }
        .opcoes button.errado {
            background-color: #e05252;
        }
        #mensagem {
            min-height: 34px;
            font-size: 26px !important;
            margin: 8px 12px !important;
        }
        .acoes {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .acoes button {
            width: 150px;
            height: 55px;
            font-size: 22px;
        }
        .dica {
            font-size: 20px !important;
            color: #dbe4ff !important;
        }
        #btnMusica {
            width: 225px;
            height: 55px;
            font-size: 22px;
            background-color: rgba(61, 93, 149, 0.4);
        }
        #btnMusica.ligada {
            background-color: rgb(50, 125, 255);
        }
        #player-musica {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body onload="focarpergunta()">
<div class="container">
    <img src="/IMAGE/Pedro.png" alt="Pedro Pinguim" class="pedro">
    <div class="cubotitle" onclick="window.location.href='/index.html'">
        <p><h1>PEDRO PINGUIM APRENDE</h1></p>
    </div>
</div>

<div class="cubotxt-port">
    <p style="font-size:23px; background-color: rgb(54, 69, 228,0.5); margin:12px; border-radius:12px; padding:6px;">📚 PORTUGUÊS COM PEDRO 🐧</p>

    <div class="placar">
        <span id="pontos">⭐ 0 pontos</span>
        <span id="sequencia">🔥 0 em seguida!</span>
    </div>

    <p class="dica">Escolha a atividade e toque na resposta certa!</p>

    <p><button id="btnMusica" onclick="alternarMusica()">🎵 MÚSICA: OFF 🔇</button></p>
    <div id="player-musica"></div>

    <div class="tipos">
        <button id="btnLetra" class="ativo" onclick="escolherTipo('letra')">🔤 LETRA</button>
        <button id="btnVogal" onclick="escolherTipo('vogal')">🅰️ VOGAIS</button>
        <button id="btnTudo" onclick="escolherTipo('tudo')">🎲 TUDO</button>
    </div>

    <div class="continha" id="continha" tabindex="-1" role="group" aria-label="Atividade de português">
        <div id="emoji" class="emoji-linha">🍎</div>
        <div id="palavra" class="palavra-linha">MAÇÃ</div>
        <div id="letraGrande" class="letra-grande" style="display:none;">A</div>
    </div>

    <p id="pergunta" class="pergunta" tabindex="-1" aria-live="polite">Com qual letra começa MAÇÃ?</p>

    <div class="opcoes" id="opcoes"></div>

    <p id="mensagem">🐧 Pedro está torcendo por você!</p>

    <div class="acoes">
        <p><button onclick="falarPergunta()" style="width: 150px;">🔊 OUVIR 👂</button></p>
        <p><button onclick="novaAtividade()" style="width: 150px;">🎲 NOVA ✨</button></p>
    </div>
    <p><button onclick="window.location.href='materia.html'" style="width: 225px;">⬅️ VOLTAR 📚</button></p>
</div>

<script>
    let tipo = 'letra';
    let respostaCerta = '';
    let pontos = 0;
    let sequencia = 0;
    let travado = false;

    // Palavras com emoji + palavra + letra inicial (sem acento na 1ª letra)
    const PALAVRAS = [
        { emoji: '🍎', palavra: 'MAÇÃ', letra: 'M' },
        { emoji: '🍌', palavra: 'BANANA', letra: 'B' },
        { emoji: '🐶', palavra: 'CACHORRO', letra: 'C' },
        { emoji: '🐱', palavra: 'GATO', letra: 'G' },
        { emoji: '🐘', palavra: 'ELEFANTE', letra: 'E' },
        { emoji: '🦁', palavra: 'LEÃO', letra: 'L' },
        { emoji: '🐟', palavra: 'PEIXE', letra: 'P' },
        { emoji: '☀️', palavra: 'SOL', letra: 'S' },
        { emoji: '🌙', palavra: 'LUA', letra: 'L' },
        { emoji: '⭐', palavra: 'ESTRELA', letra: 'E' },
        { emoji: '🌸', palavra: 'FLOR', letra: 'F' },
        { emoji: '🏠', palavra: 'CASA', letra: 'C' },
        { emoji: '🚗', palavra: 'CARRO', letra: 'C' },
        { emoji: '⚽', palavra: 'BOLA', letra: 'B' },
        { emoji: '📚', palavra: 'LIVRO', letra: 'L' },
        { emoji: '🎈', palavra: 'BALÃO', letra: 'B' },
        { emoji: '🐸', palavra: 'SAPO', letra: 'S' },
        { emoji: '🐮', palavra: 'VACA', letra: 'V' },
        { emoji: '🐷', palavra: 'PORCO', letra: 'P' },
        { emoji: '🐻', palavra: 'URSO', letra: 'U' },
        { emoji: '🐜', palavra: 'FORMIGA', letra: 'F' },
        { emoji: '🍇', palavra: 'UVA', letra: 'U' },
        { emoji: '🍊', palavra: 'LARANJA', letra: 'L' },
        { emoji: '🍓', palavra: 'MORANGO', letra: 'M' },
        { emoji: '🥚', palavra: 'OVO', letra: 'O' },
        { emoji: '🦆', palavra: 'PATO', letra: 'P' },
        { emoji: '🐔', palavra: 'GALINHA', letra: 'G' },
        { emoji: '🐴', palavra: 'CAVALO', letra: 'C' },
        { emoji: '🐵', palavra: 'MACACO', letra: 'M' },
        { emoji: '🐝', palavra: 'ABELHA', letra: 'A' },
        { emoji: '🐢', palavra: 'TARTARUGA', letra: 'T' },
        { emoji: '🦋', palavra: 'BORBOLETA', letra: 'B' },
        { emoji: '🎂', palavra: 'BOLO', letra: 'B' },
        { emoji: '🧸', palavra: 'URSINHO', letra: 'U' }
    ];

    const VOGAIS = ['A', 'E', 'I', 'O', 'U'];
    const CONSOANTES = ['B', 'C', 'D', 'F', 'G', 'H', 'J', 'L', 'M', 'N', 'P', 'R', 'S', 'T', 'V', 'X', 'Z'];

    const ELOGIOS = [
        '🎉 MUITO BEM! Você é demais!',
        '🐧 UAU! O Pedro amou!',
        '⭐ INCRÍVEL! Continua assim!',
        '📚 DELÍCIA! Você acertou!',
        '🌈 PERFEITO! Estrela para você!'
    ];
    const TENTE = [
        '🐧 Quase! Olhe a primeira letra com calminha!',
        '🔤 Opa! Tente de novo, você consegue!',
        '💪 Vamos lá! Preste atenção na palavra!'
    ];

    function numeroAleatorio(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function embaralhar(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function escolherTipo(novoTipo) {
        tipo = novoTipo;
        document.querySelectorAll('.tipos button').forEach(b => b.classList.remove('ativo'));
        if (tipo === 'letra') document.querySelector('#btnLetra').classList.add('ativo');
        if (tipo === 'vogal') document.querySelector('#btnVogal').classList.add('ativo');
        if (tipo === 'tudo') document.querySelector('#btnTudo').classList.add('ativo');
        novaAtividade();
    }

    function novaAtividade() {
        travado = false;
        let atividade = tipo;
        if (tipo === 'tudo') {
            atividade = Math.random() < 0.6 ? 'letra' : 'vogal';
        }
        if (atividade === 'letra') {
            mostrarLetra();
        } else {
            mostrarVogal();
        }
    }

    function mostrarLetra() {
        const item = PALAVRAS[numeroAleatorio(0, PALAVRAS.length - 1)];
        respostaCerta = item.letra;

        // Mostra emoji + palavra
        document.querySelector('#emoji').style.display = 'block';
        document.querySelector('#palavra').style.display = 'block';
        document.querySelector('#letraGrande').style.display = 'none';

        document.querySelector('#emoji').textContent = item.emoji;
        const primeira = item.palavra.charAt(0);
        const resto = item.palavra.slice(1);
        document.querySelector('#palavra').innerHTML =
            `<span class="letra-destaque">${primeira}</span>${resto}`;

        // Pergunta
        document.querySelector('#pergunta').textContent = `Com qual letra começa ${item.palavra}?`;
        document.querySelector('#pergunta').dataset.texto =
            `Com qual letra começa a palavra ${item.palavra}?`;

        // Opções: 1 certa + 2 erradas
        const alfabeto = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        let opcoes = new Set([item.letra]);
        while (opcoes.size < 3) {
            opcoes.add(alfabeto[numeroAleatorio(0, alfabeto.length - 1)]);
        }
        opcoes = embaralhar([...opcoes]);
        criarBotoes(opcoes, false);
    }

    function mostrarVogal() {
        const ehVogal = Math.random() < 0.5;
        const letra = ehVogal
            ? VOGAIS[numeroAleatorio(0, VOGAIS.length - 1)]
            : CONSOANTES[numeroAleatorio(0, CONSOANTES.length - 1)];

        respostaCerta = ehVogal ? 'VOGAL' : 'CONSOANTE';

        // Mostra só a letra grande
        document.querySelector('#emoji').style.display = 'none';
        document.querySelector('#palavra').style.display = 'none';
        document.querySelector('#letraGrande').style.display = 'block';
        document.querySelector('#letraGrande').textContent = letra;

        // Pergunta
        document.querySelector('#pergunta').textContent = `A letra ${letra} é...`;
        document.querySelector('#pergunta').dataset.texto =
            `A letra ${letra} é uma vogal ou uma consoante?`;

        criarBotoes(['VOGAL', 'CONSOANTE'], true);
    }

    function criarBotoes(opcoes, largo) {
        const container = document.querySelector('#opcoes');
        container.innerHTML = '';
        opcoes.forEach(op => {
            const btn = document.createElement('button');
            btn.textContent = op;
            if (largo) btn.classList.add('largo');
            btn.onclick = function () { responder(this); };
            container.appendChild(btn);
        });
    }

    function responder(botao) {
        if (travado) return;
        const valor = botao.textContent.trim();
        if (valor === respostaCerta) {
            travado = true;
            botao.classList.add('certo');
            pontos += 1;
            sequencia += 1;
            document.querySelector('#mensagem').textContent =
                ELOGIOS[numeroAleatorio(0, ELOGIOS.length - 1)];
            falar('Parabéns! Você acertou!');
            setTimeout(novaAtividade, 1800);
        } else {
            botao.classList.add('errado');
            sequencia = 0;
            document.querySelector('#mensagem').textContent =
                TENTE[numeroAleatorio(0, TENTE.length - 1)];
            falar('Tente de novo! Você consegue!');
        }
        atualizarPlacar();
    }

    function atualizarPlacar() {
        document.querySelector('#pontos').textContent = `⭐ ${pontos} pontos`;
        document.querySelector('#sequencia').textContent = `🔥 ${sequencia} em seguida!`;
    }

    // --- Voz ---
    let vozesDisponiveis = [];

    function carregarVozes() {
        try {
            vozesDisponiveis = window.speechSynthesis.getVoices();
        } catch (e) { /* ignora */ }
    }
    if ('speechSynthesis' in window) {
        carregarVozes();
        window.speechSynthesis.onvoiceschanged = carregarVozes;
    }

    function falar(texto) {
        if (!('speechSynthesis' in window) || !window.speechSynthesis) {
            return;
        }
        try {
            const synth = window.speechSynthesis;
            synth.cancel();
            synth.resume();
            const voz = new SpeechSynthesisUtterance(texto);
            voz.lang = 'pt-BR';
            voz.rate = 0.9;
            voz.pitch = 1.1;
            const vozBR = vozesDisponiveis.find(v => v.lang && v.lang.toLowerCase().startsWith('pt'));
            if (vozBR) {
                voz.voice = vozBR;
                voz.lang = vozBR.lang;
            }
            voz.onerror = function (event) {
                const erro = event && event.error ? event.error : '';
                if (erro === 'canceled' || erro === 'interrupted') return;
                restaurarMusica();
            };
            abaixarMusica();
            voz.onend = restaurarMusica;
            setTimeout(() => synth.speak(voz), 100);
        } catch (e) {
            // Falha de voz silenciosa: não sobrescreve o resultado da questão
        }
    }

    function falarPergunta() {
        const el = document.querySelector('#pergunta');
        const texto = el.dataset.texto || el.textContent;
        falar(texto);
    }

    // --- Música de fundo (YouTube) ---
    const MUSICA_ID = '8JCJbekaAw4';
    const MUSICA_VOLUME = 50;
    const MUSICA_VOLUME_BAIXO = 12;
    let playerMusica = null;
    let musicaLigada = false;
    let playerPronto = false;
    let querTocar = false;

    function abaixarMusica() {
        try {
            if (musicaLigada && playerPronto && playerMusica && playerMusica.setVolume) {
                playerMusica.setVolume(MUSICA_VOLUME_BAIXO);
            }
        } catch (e) { /* ignora */ }
    }

    function restaurarMusica() {
        try {
            if (musicaLigada && playerPronto && playerMusica && playerMusica.setVolume) {
                playerMusica.setVolume(MUSICA_VOLUME);
            }
        } catch (e) { /* ignora */ }
    }

    function atualizarBtnMusica() {
        const btn = document.querySelector('#btnMusica');
        if (!btn) return;
        if (musicaLigada) {
            btn.classList.add('ligada');
            btn.textContent = '🎶 MÚSICA: ON 🔊';
        } else {
            btn.classList.remove('ligada');
            btn.textContent = '🎵 MÚSICA: OFF 🔇';
        }
    }

    function onYouTubeIframeAPIReady() {
        playerMusica = new YT.Player('player-musica', {
            height: '1',
            width: '1',
            videoId: MUSICA_ID,
            playerVars: { autoplay: 0, loop: 1, playlist: MUSICA_ID, rel: 0 },
            events: {
                onReady: function () {
                    playerPronto = true;
                    try { playerMusica.setVolume(MUSICA_VOLUME); } catch (e) { /* ignora */ }
                    if (querTocar) {
                        querTocar = false;
                        playerMusica.playVideo();
                    }
                },
                onStateChange: function (e) {
                    if (musicaLigada && e.data === YT.PlayerState.ENDED) {
                        playerMusica.playVideo();
                    }
                },
                onError: function () {
                    musicaLigada = false;
                    querTocar = false;
                    atualizarBtnMusica();
                    document.querySelector('#mensagem').textContent =
                        '🔇 Ops! A música não carregou. Confira a internet! 🐧';
                }
            }
        });
    }

    function alternarMusica() {
        if (!playerMusica || !playerPronto) {
            musicaLigada = true;
            querTocar = true;
            atualizarBtnMusica();
            document.querySelector('#mensagem').textContent = '🎶 Carregando a musiquinha... 🐧';
            if (typeof YT === 'undefined' || !YT.Player) return;
            return;
        }
        try {
            if (musicaLigada) {
                playerMusica.pauseVideo();
                musicaLigada = false;
            } else {
                playerMusica.playVideo();
                musicaLigada = true;
            }
        } catch (e) {
            document.querySelector('#mensagem').textContent =
                '🔇 Ops! A música falhou. Tente de novo! 🐧';
        }
        atualizarBtnMusica();
    }

    function focarpergunta() {
        const pergunta = document.querySelector('#pergunta');
        if (!pergunta) return;
        pergunta.scrollIntoView({ behavior: 'smooth', block: 'center' });
        try {
            pergunta.focus({ preventScroll: true });
        } catch (e) {
            pergunta.focus();
        }
    }

    // Inicializa
    novaAtividade();
    window.addEventListener('load', () => setTimeout(focarpergunta, 100));
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
