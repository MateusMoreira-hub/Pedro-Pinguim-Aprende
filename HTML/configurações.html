        <p><button style="width: 225px;background-color: rgb(50, 125, 255);" id="op2" onclick="op2()">FORTNITE</button></p>

<!--Versão base sem as funcionalidades-->
</div>
<script>
musica = document.querySelector("#musica");

function opmusica(){
    if(musica.style.backgroundColor == "rgb(50, 125, 255)"){
        musica.style.backgroundColor = "rgba(61, 93, 149, 0.4)";
        musica.innerHTML="❌​​MÚSICA🔇";
    } else {
        musica.style.backgroundColor = "rgb(50, 125, 255)"; 
        musica.innerHTML="🎵​MÚSICA🔊";
    }
}
</script>
